[package]
name = "aura-codec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Experimental binary event-file format and replay codec lab"
repository = "https://github.com/curvefit/aura"

[lib]
name = "aura_codec"
path = "src/lib.rs"

[[bin]]
name = "aura-size"
path = "src/bin/aura_size.rs"

[[bin]]
name = "aura-bench"
path = "src/bin/aura_bench.rs"

[[bin]]
name = "aura-sdk-bench"
path = "src/bin/aura_sdk_bench.rs"

[[bin]]
name = "aura-fixture-gen"
path = "src/bin/aura_fixture_gen.rs"

[[bin]]
name = "aura-verify-random"
path = "src/bin/aura_verify_random.rs"

[[bin]]
name = "aura-parquet-ohlcv"
path = "src/bin/parquet_ohlcv.rs"

[dependencies]
anyhow = "1"
arrow = { version = "54", default-features = false, features = ["ipc_compression"] }
flatbuffers = "24.12.23"
parquet = { version = "54", features = ["zstd"] }
lz4_flex = "0.11.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13.3"

[[bin]]
name = "aura-json-i64"
path = "src/bin/json_i64_rows.rs"

[[bin]]
name = "aura"
path = "src/bin/aura.rs"

[[bin]]
name = "aura-replay-bench"
path = "src/bin/aura_replay_bench.rs"
